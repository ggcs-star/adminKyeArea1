name: Laravel + React (Inertia.js) CI/CD Pipeline

on:
  push:
    branches:
      - navin-branch   # main branch पर push होते ही pipeline चलेगी

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Setup PHP (Laravel के लिए)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, intl, mongodb
          coverage: none

      # 3️⃣ Setup Node.js (React/Vite के लिए)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 4️⃣ Install Composer Dependencies
      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # 5️⃣ Install NPM Dependencies
      - name: Install NPM Packages
        run: npm install

      # 6️⃣ Build Frontend (Vite/React)
      - name: Build React Frontend
        run: npm run build

      # 7️⃣ Copy Environment File (Production ke liye)
      - name: Copy .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # 8️⃣ Run Tests (Optional)
      - name: Run Laravel Tests
        run: php artisan test || true

      # 9️⃣ Deploy to Server (VPS or Production)
      - name: Deploy to Server via SSH
        if: success()
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /var/www/your_project_folder
            git pull origin main
            composer install --no-interaction --prefer-dist --optimize-autoloader
            npm install
            npm run build
            php artisan migrate --force
            php artisan optimize:clear
